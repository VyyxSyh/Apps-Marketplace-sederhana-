<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="TOKOKO, marketplace sederhana untuk kebutuhan sehari-hari.">
  <title>TOKOKO | Belanja kebutuhan harian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/tailwind.css">
  <script src="store.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell mx-auto w-full max-w-7xl pb-[calc(78px_+_env(safe-area-inset-bottom))]">
    <header class="sticky top-0 z-20 border-b border-(--line) bg-(--paper) px-3 py-2.5 pt-[calc(10px+env(safe-area-inset-top))] sm:px-5 sm:pt-2.5">
      <div class="header-inner mx-auto flex w-full min-w-0 max-w-6xl items-center gap-2 sm:gap-3.5">
        <a class="shrink-0 whitespace-nowrap text-[18px] font-black tracking-[-0.06em] text-(--green) no-underline sm:text-[19px]" href="#home" aria-label="TOKOKO, beranda">TOKOKO</a>
        <form id="searchForm" class="flex min-h-[46px] min-w-0 flex-1 items-center gap-[9px] rounded-[11px] border border-(--line) bg-(--surface) py-0 pl-3 pr-[5px] focus-within:border-(--green) max-[767px]:gap-2.5 max-[520px]:gap-[5px] max-[520px]:pl-2.5" role="search">
          <label class="sr-only" for="searchInput">Cari produk</label>
          <input class="w-full min-w-0 border-0 bg-transparent text-sm text-(--ink) outline-none" id="searchInput" type="search" placeholder="Cari kebutuhanmu" autocomplete="off">
          <button class="grid size-11 shrink-0 place-items-center rounded-[10px] border-0 bg-transparent text-(--green) transition-[background-color,transform] duration-150 hover:bg-[#e8ead8] active:scale-[.94]" type="submit" aria-label="Cari produk">
            <svg class="size-[21px] fill-none stroke-current [stroke-linecap:round] [stroke-width:2]" aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
          </button>
        </form>
        <button class="relative grid size-11 shrink-0 place-items-center rounded-xl border-0 bg-transparent text-(--green) hover:bg-[#e8ead8]" type="button" data-action="cart" aria-label="Buka keranjang">
          <svg class="size-[23px] fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:1.8]" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.1a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 1.9-1.4L21 8H6M10 20h.01M18 20h.01"/></svg>
          <span id="cartBadge" class="absolute top-0 right-0 min-w-[18px] h-[18px] rounded-full bg-(--clay) text-center text-[11px] leading-[18px] font-extrabold text-white [transform-origin:center]" hidden>0</span>
        </button>
      </div>
    </header>

    <main id="mainContent" class="mx-auto w-[calc(100%-40px)] max-w-[1080px]">
      <section id="home" class="mt-4 flex min-h-44 items-center justify-between gap-3.5 rounded-2xl border border-[#d6d9bd] bg-[#e8ead8] px-4 py-4 max-[520px]:min-h-44 max-[520px]:overflow-hidden max-[520px]:px-[15px] max-[520px]:py-[18px] md:mt-[26px] md:min-h-[250px] md:px-[42px] md:py-[38px]" aria-labelledby="pageTitle">
        <div class="min-w-0 max-w-[620px]">
          <p class="mb-[9px] text-xs font-black text-(--green)">Belanja berbagai kebutuhan</p>
          <h1 id="pageTitle" class="m-0 max-w-[520px] leading-tight font-extrabold tracking-tight text-(--green-deep) [font-size:clamp(27px,8vw,36px)] md:text-4xl">Cari barang, lalu Checkout.</h1>
          <p class="mt-3 max-w-[390px] text-sm leading-[1.5] text-[#465243]">Jelajahi produk dari berbagai kategori, bandingkan pilihan, lalu pesan dari satu tempat.</p>
        </div>
        <div class="hidden size-[98px] shrink-0 rotate-[7deg] flex-col items-center justify-center rounded-full border border-[#a9b08b] text-(--green) sm:flex md:size-[122px]" aria-hidden="true"><span class="text-xs">Pilih</span><strong class="font-(--font-heading) text-2xl tracking-[-0.08em]">barang</strong></div>
      </section>

      <section class="mt-[30px]" aria-labelledby="categoryTitle">
        <div class="mb-3 flex min-w-0 items-start justify-between gap-3 md:items-end">
          <div class="min-w-0"><h2 class="m-0 text-lg font-bold tracking-tight" id="categoryTitle">Kategori</h2><p class="mt-1 max-w-56 text-[13px] text-(--muted)">Pilih kategori untuk menyaring produk.</p></div>
        </div>
        <div id="categories" class="flex max-w-full snap-x snap-proximity gap-2 overflow-x-auto overflow-y-hidden px-0.5 pt-[3px] pb-2.5 [-webkit-overflow-scrolling:touch] [&>*]:snap-start [scrollbar-width:thin] [scrollbar-color:#aeb7a5_transparent] md:flex-wrap md:overflow-x-visible [&::-webkit-scrollbar]:h-1 [&::-webkit-scrollbar-thumb]:rounded [&::-webkit-scrollbar-thumb]:bg-[#aeb7a5] [&::-webkit-scrollbar-track]:bg-transparent" aria-label="Kategori produk"></div>
      </section>

      <section id="catalog" class="mt-[33px] md:mt-8" aria-labelledby="productHeading">
        <div class="mb-3 flex min-w-0 items-start justify-between gap-3 md:items-end">
          <div class="min-w-0"><h2 class="m-0 text-lg font-bold tracking-tight" id="productHeading">Semua produk</h2><p id="productSubheading" class="mt-1 max-w-56 text-[13px] text-(--muted) max-[520px]:max-w-[220px]">Produk dari berbagai toko</p></div>
          <label class="flex shrink-0 items-center gap-2 whitespace-nowrap text-xs text-(--muted) max-[520px]:flex-col max-[520px]:items-end max-[520px]:gap-[3px]">Urutkan
            <select class="min-h-10 max-w-[132px] rounded-[9px] border border-(--line) bg-(--surface) px-2 text-xs text-(--ink) focus:outline-none focus:shadow-none" id="sortSelect" aria-label="Urutkan produk">
              <option value="featured">Pilihan</option>
              <option value="price-asc">Harga terendah</option>
              <option value="price-desc">Harga tertinggi</option>
              <option value="name">Nama A–Z</option>
              <option value="newest">Terbaru</option>
            </select>
          </label>
        </div>
        <div id="products" class="grid min-w-0 grid-cols-2 gap-2.5 md:grid-cols-3 md:gap-4 xl:grid-cols-4" aria-live="polite"></div>
      </section>
    </main>

      <nav class="fixed inset-x-0 bottom-0 z-30 flex min-h-[calc(68px_+_env(safe-area-inset-bottom))] justify-center gap-1 border-t border-(--line) bg-(--surface) px-[max(10px,env(safe-area-inset-left))] pt-1 pb-[calc(5px+env(safe-area-inset-bottom))] shadow-[0_-5px_20px_#242a2014] md:left-1/2 md:w-full md:max-w-7xl md:-translate-x-1/2" aria-label="Navigasi utama">
        <a class="relative flex min-h-[52px] min-w-0 flex-1 flex-col items-center justify-center gap-[3px] rounded-xl border-0 bg-transparent text-[10px] leading-[1.15] font-bold text-(--muted) no-underline transition-colors hover:text-(--green-deep) active:bg-(--paper) [&.is-active]:text-(--green) [&.is-active]:before:absolute [&.is-active]:before:inset-[2px_8px_auto] [&.is-active]:before:h-0.5 [&.is-active]:before:rounded-sm [&.is-active]:before:bg-(--green) md:max-w-[150px] md:flex-row md:gap-2 md:text-xs md:[&.is-active]:before:inset-[auto_12px_3px]" href="#home" data-nav="home">
        <svg class="size-[22px] fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:1.8]" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Beranda</span>
      </a>
      <a class="relative flex min-h-[52px] min-w-0 flex-1 flex-col items-center justify-center gap-[3px] rounded-xl border-0 bg-transparent text-[10px] leading-[1.15] font-bold text-(--muted) no-underline transition-colors hover:text-(--green-deep) active:bg-(--paper) [&.is-active]:text-(--green) [&.is-active]:before:absolute [&.is-active]:before:inset-[2px_8px_auto] [&.is-active]:before:h-0.5 [&.is-active]:before:rounded-sm [&.is-active]:before:bg-(--green) md:max-w-[150px] md:flex-row md:gap-2 md:text-xs md:[&.is-active]:before:inset-[auto_12px_3px]" href="#catalog" data-nav="catalog">
        <svg class="size-[22px] fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:1.8]" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h7v7H4zM14 5h6v7h-6zM4 15h7v5H4zM14 15h6v5h-6z"/></svg><span>Katalog</span>
      </a>
      <button class="relative flex min-h-[52px] min-w-0 flex-1 flex-col items-center justify-center gap-[3px] rounded-xl border-0 bg-transparent text-[10px] leading-[1.15] font-bold text-(--muted) transition-colors hover:text-(--green-deep) active:bg-(--paper) md:max-w-[150px] md:flex-row md:gap-2 md:text-xs" type="button" data-action="seller-products" data-seller-nav hidden>
        <svg class="size-[22px] fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:1.8]" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16v14H4zM8 7V4h8v3M8 12h8M8 16h5"/></svg><span>Produk saya</span>
      </button>
      <button class="relative flex min-h-[52px] min-w-0 flex-1 flex-col items-center justify-center gap-[3px] rounded-xl border-0 bg-transparent text-[10px] leading-[1.15] font-bold text-(--muted) transition-colors hover:text-(--green-deep) active:bg-(--paper) md:max-w-[150px] md:flex-row md:gap-2 md:text-xs" type="button" data-action="orders" data-buyer-nav>
        <svg class="size-[22px] fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:1.8]" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM8 8h8M8 12h8M8 16h4"/></svg><span>Pesanan</span>
      </button>
      <button class="relative flex min-h-[52px] min-w-0 flex-1 flex-col items-center justify-center gap-[3px] rounded-xl border-0 bg-transparent text-[10px] leading-[1.15] font-bold text-(--muted) transition-colors hover:text-(--green-deep) active:bg-(--paper) md:max-w-[150px] md:flex-row md:gap-2 md:text-xs" type="button" data-action="account">
        <svg class="size-[22px] fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:1.8]" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Akun</span>
      </button>
    </nav>
  </div>

  <div id="overlay" class="overlay fixed inset-0 z-40 flex items-end justify-center bg-[#1d261db3] p-0 md:items-center md:p-4" hidden>
    <section class="dialog max-h-[min(88vh,820px)] w-full max-w-xl overflow-auto overscroll-contain rounded-t-2xl border border-(--line) bg-(--surface) md:rounded-2xl" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <header class="sticky top-0 z-[1] flex min-h-15 items-center justify-between border-b border-(--line) bg-(--surface) px-4 py-2"><h2 id="modalTitle" class="m-0 font-(--font-heading) text-lg"></h2><button class="grid size-11 place-items-center rounded-full border-0 bg-[#eeece4] text-[25px] text-(--ink)" type="button" data-action="close" aria-label="Tutup">×</button></header>
      <div id="modalBody" class="dialog-body min-w-0 px-[18px] pt-4 pb-[calc(22px_+_env(safe-area-inset-bottom))]"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
