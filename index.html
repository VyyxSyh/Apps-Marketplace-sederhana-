<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="TOKOKO, marketplace sederhana untuk kebutuhan sehari-hari.">
  <title>TOKOKO | Belanja kebutuhan harian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/tailwind.css">
  <link rel="stylesheet" href="stylesheet.css">
  <script src="store.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell mx-auto w-full max-w-7xl pb-[calc(78px_+_env(safe-area-inset-bottom))]">
    <header class="site-header sticky top-0 z-20 border-b border-(--line) bg-(--paper) px-3 py-2.5 sm:px-5">
      <div class="header-inner mx-auto flex w-full min-w-0 max-w-6xl items-center gap-2 sm:gap-3.5">
        <a class="brand shrink-0 whitespace-nowrap text-base sm:text-lg" href="#home" aria-label="TOKOKO, beranda">TOKOKO</a>
        <form id="searchForm" class="search-box flex min-h-12 min-w-0 flex-1 items-center gap-1.5 rounded-xl border py-0 pl-2 pr-1 sm:gap-2 sm:pl-3" role="search">
          <label class="sr-only" for="searchInput">Cari produk</label>
          <input id="searchInput" type="search" placeholder="Cari kebutuhanmu" autocomplete="off">
          <button class="search-submit" type="submit" aria-label="Cari produk">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
          </button>
        </form>
        <button class="header-cart" type="button" data-action="cart" aria-label="Buka keranjang">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.1a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 1.9-1.4L21 8H6M10 20h.01M18 20h.01"/></svg>
          <span id="cartBadge" class="cart-badge" hidden>0</span>
        </button>
      </div>
    </header>

    <main id="mainContent">
      <section id="home" class="market-intro mt-4 flex min-h-44 items-center justify-between gap-3.5 rounded-2xl px-4 py-4 max-sm:overflow-hidden md:mt-7 md:min-h-64 md:px-10 md:py-9" aria-labelledby="pageTitle">
        <div class="max-w-2xl min-w-0">
          <p class="intro-kicker">Belanja berbagai kebutuhan</p>
          <h1 id="pageTitle" class="m-0 max-w-xl text-3xl leading-tight tracking-tight md:text-4xl">Cari barang, lalu Checkout.</h1>
          <p class="intro-copy">Jelajahi produk dari berbagai kategori, bandingkan pilihan, lalu pesan dari satu tempat.</p>
        </div>
        <div class="market-stamp hidden size-16 shrink-0 flex-col items-center justify-center rounded-full sm:flex md:size-32" aria-hidden="true"><span>Pilih</span><strong>barang</strong></div>
      </section>

      <section class="catalog-section mt-6" aria-labelledby="categoryTitle">
        <div class="section-heading mb-3 flex items-start justify-between gap-3 md:items-end">
          <div class="min-w-0"><h2 class="m-0 text-lg font-bold tracking-tight" id="categoryTitle">Kategori</h2><p class="mt-1 max-w-56 text-sm">Pilih kategori untuk menyaring produk.</p></div>
        </div>
        <div id="categories" class="category-list" aria-label="Kategori produk"></div>
      </section>

      <section id="catalog" class="catalog-section products-section mt-6 md:mt-8" aria-labelledby="productHeading">
        <div class="section-heading product-heading-row mb-3 flex items-start justify-between gap-3 md:items-end">
          <div class="min-w-0"><h2 class="m-0 text-lg font-bold tracking-tight" id="productHeading">Semua produk</h2><p id="productSubheading" class="mt-1 max-w-56 text-sm">Produk dari berbagai toko</p></div>
          <label class="sort-control flex shrink-0 items-center gap-2 whitespace-nowrap text-xs text-(--muted) max-sm:flex-col max-sm:items-end max-sm:gap-1">Urutkan
            <select class="min-h-10 max-w-32 rounded-lg border border-(--line) bg-(--surface) px-2 text-xs text-(--ink)" id="sortSelect" aria-label="Urutkan produk">
              <option value="featured">Pilihan</option>
              <option value="price-asc">Harga terendah</option>
              <option value="price-desc">Harga tertinggi</option>
              <option value="name">Nama A–Z</option>
              <option value="newest">Terbaru</option>
            </select>
          </label>
        </div>
        <div id="products" class="product-grid grid grid-cols-2 gap-2.5 md:grid-cols-3 md:gap-4 xl:grid-cols-4" aria-live="polite"></div>
      </section>
    </main>

    <nav class="bottom-nav fixed inset-x-0 bottom-0 z-30 flex min-h-[calc(68px_+_env(safe-area-inset-bottom))] justify-center border-t border-(--line) bg-(--surface) px-2 pt-1 pb-[calc(5px_+_env(safe-area-inset-bottom))] shadow-[0_-5px_20px_#242a2014] md:left-1/2 md:w-full md:max-w-7xl md:-translate-x-1/2" aria-label="Navigasi utama">
      <a class="nav-item flex min-h-12 min-w-16 flex-1 flex-col items-center justify-center gap-0.5 rounded-xl border-0 bg-transparent text-[11px] font-bold text-(--muted) no-underline transition-colors hover:text-(--green-deep) active:bg-(--paper) [&.is-active]:bg-(--paper) [&.is-active]:text-(--green) md:max-w-36 md:flex-row md:gap-2 md:text-xs" href="#home" data-nav="home">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Beranda</span>
      </a>
      <a class="nav-item flex min-h-12 min-w-16 flex-1 flex-col items-center justify-center gap-0.5 rounded-xl border-0 bg-transparent text-[11px] font-bold text-(--muted) no-underline transition-colors hover:text-(--green-deep) active:bg-(--paper) [&.is-active]:bg-(--paper) [&.is-active]:text-(--green) md:max-w-36 md:flex-row md:gap-2 md:text-xs" href="#catalog" data-nav="catalog">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h7v7H4zM14 5h6v7h-6zM4 15h7v5H4zM14 15h6v5h-6z"/></svg><span>Katalog</span>
      </a>
      <button class="nav-item flex min-h-12 min-w-16 flex-1 flex-col items-center justify-center gap-0.5 rounded-xl border-0 bg-transparent text-[11px] font-bold text-(--muted) transition-colors hover:text-(--green-deep) active:bg-(--paper) md:max-w-36 md:flex-row md:gap-2 md:text-xs" type="button" data-action="seller-products" data-seller-nav hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16v14H4zM8 7V4h8v3M8 12h8M8 16h5"/></svg><span>Produk saya</span>
      </button>
      <button class="nav-item flex min-h-12 min-w-16 flex-1 flex-col items-center justify-center gap-0.5 rounded-xl border-0 bg-transparent text-[11px] font-bold text-(--muted) transition-colors hover:text-(--green-deep) active:bg-(--paper) md:max-w-36 md:flex-row md:gap-2 md:text-xs" type="button" data-action="orders" data-buyer-nav>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM8 8h8M8 12h8M8 16h4"/></svg><span>Pesanan</span>
      </button>
      <button class="nav-item flex min-h-12 min-w-16 flex-1 flex-col items-center justify-center gap-0.5 rounded-xl border-0 bg-transparent text-[11px] font-bold text-(--muted) transition-colors hover:text-(--green-deep) active:bg-(--paper) md:max-w-36 md:flex-row md:gap-2 md:text-xs" type="button" data-action="account">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Akun</span>
      </button>
    </nav>
  </div>

  <div id="overlay" class="overlay fixed inset-0 z-40 flex items-end justify-center bg-[#1d261db3] p-0 md:items-center md:p-4" hidden>
    <section class="dialog max-h-[min(88vh,820px)] w-full max-w-xl overflow-auto overscroll-contain rounded-t-2xl border border-(--line) bg-(--surface) md:rounded-2xl" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <header class="dialog-header sticky top-0 z-[1] flex min-h-15 items-center justify-between border-b border-(--line) bg-(--surface) px-4 py-2"><h2 id="modalTitle"></h2><button class="icon-button" type="button" data-action="close" aria-label="Tutup">×</button></header>
      <div id="modalBody" class="dialog-body min-w-0 px-[18px] pt-4 pb-[calc(22px_+_env(safe-area-inset-bottom))]"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
