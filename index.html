<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="TOKOKO, marketplace sederhana untuk kebutuhan sehari-hari.">
  <title>TOKOKO | Belanja kebutuhan harian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/tailwind.css">
  <link rel="stylesheet" href="stylesheet.css">
  <script src="store.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand shrink-0" href="#home" aria-label="TOKOKO, beranda">TOKOKO</a>
        <form id="searchForm" class="search-box" role="search">
          <label class="sr-only" for="searchInput">Cari produk</label>
          <span aria-hidden="true" class="search-mark">Cari</span>
          <input id="searchInput" type="search" placeholder="Cari kebutuhanmu" autocomplete="off">
          <button class="search-submit" type="submit">Cari</button>
        </form>
        <button class="header-cart" type="button" data-action="cart" aria-label="Buka keranjang">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.1a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 1.9-1.4L21 8H6M10 20h.01M18 20h.01"/></svg>
          <span id="cartBadge" class="cart-badge" hidden>0</span>
        </button>
      </div>
    </header>

    <main id="mainContent">
      <section id="home" class="market-intro" aria-labelledby="pageTitle">
        <div>
          <p class="intro-kicker">Belanja berbagai kebutuhan</p>
          <h1 id="pageTitle">Cari barang, lalu Checkout.</h1>
          <p class="intro-copy">Jelajahi produk dari berbagai kategori, bandingkan pilihan, lalu pesan dari satu tempat.</p>
        </div>
        <div class="market-stamp" aria-hidden="true"><span>Pilih</span><strong>barang</strong></div>
      </section>

      <section class="catalog-section" aria-labelledby="categoryTitle">
        <div class="section-heading">
          <div><h2 id="categoryTitle">Kategori</h2><p>Pilih kategori untuk menyaring produk.</p></div>
        </div>
        <div id="categories" class="category-list" aria-label="Kategori produk"></div>
      </section>

      <section id="catalog" class="catalog-section products-section" aria-labelledby="productHeading">
        <div class="section-heading product-heading-row">
          <div><h2 id="productHeading">Semua produk</h2><p id="productSubheading">Produk dari berbagai toko</p></div>
          <label class="sort-control">Urutkan
            <select id="sortSelect" aria-label="Urutkan produk">
              <option value="featured">Pilihan</option>
              <option value="price-asc">Harga terendah</option>
              <option value="price-desc">Harga tertinggi</option>
              <option value="name">Nama A–Z</option>
              <option value="newest">Terbaru</option>
            </select>
          </label>
        </div>
        <div id="products" class="product-grid" aria-live="polite"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigasi utama">
      <a class="nav-item is-active" href="#home" data-nav="home">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Beranda</span>
      </a>
      <a class="nav-item" href="#catalog" data-nav="catalog">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h7v7H4zM14 5h6v7h-6zM4 15h7v5H4zM14 15h6v5h-6z"/></svg><span>Katalog</span>
      </a>
      <button class="nav-item" type="button" data-action="seller-products" data-seller-nav hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16v14H4zM8 7V4h8v3M8 12h8M8 16h5"/></svg><span>Produk saya</span>
      </button>
      <button class="nav-item" type="button" data-action="orders" data-buyer-nav>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM8 8h8M8 12h8M8 16h4"/></svg><span>Pesanan</span>
      </button>
      <button class="nav-item" type="button" data-action="account">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Akun</span>
      </button>
    </nav>
  </div>

  <div id="overlay" class="overlay" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <header class="dialog-header"><h2 id="modalTitle"></h2><button class="icon-button" type="button" data-action="close" aria-label="Tutup">×</button></header>
      <div id="modalBody" class="dialog-body"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
